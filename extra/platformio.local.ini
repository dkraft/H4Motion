; H4Motion overlay. `make setup` symlinks this to MeshCore/platformio.local.ini.

[env:heltec_v4_motion]
extends = heltec_v4_oled
build_flags =
  ${heltec_v4_oled.build_flags}
  -I ../firmware
  -I examples/simple_sensor
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"H4Motion"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  ; Later -D wins. A spaced "-U NAME" is eaten by PlatformIO and becomes a bare -U.
  -D LORA_FREQ=910.525
  -D LORA_SF=10
  -D LORA_BW=62.5
  -D LORA_CR=5
  -D ADMIN_PASSWORD='"123456"'
  -D FIRMWARE_VERSION='"v0.1.14-h4"'
  -D SENSE_CHANNEL_NAME='"#sensemb"'
  -D RD03_RX_PIN=47
  -D RD03_TX_PIN=48
  -D RD03_BAUD=256000
  -D RD03_NEAR_MM=2500
  -D RD03_TRACK_SECS=3
  -D RD03_HEART_SECS=60
  -D RD03_RANGE_MM=8000
build_src_filter =
  ${heltec_v4_oled.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_sensor/SensorMesh.cpp>
  +<../examples/simple_sensor/TimeSeriesData.cpp>
  +<../../firmware>
lib_deps =
  ${heltec_v4_oled.lib_deps}
  ${esp32_ota.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13
